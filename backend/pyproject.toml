[project]
name = "backend"
version = "0.1.0"
description = "AutoGuardian API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "fastapi[standard]>=0.165.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.9",
    "sqlalchemy>=2.1.9",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
